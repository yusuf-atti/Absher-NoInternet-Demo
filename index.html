<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطاقة معايدة أعضاء صحيفة الحقيقة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Cairo', sans-serif; background: #0f172a; color: white; }
        .editor-card { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(15px); border: 2px solid #c5a059; }
        canvas { border-radius: 15px; box-shadow: 0 30px 60px rgba(0,0,0,0.5); max-width: 100%; height: auto; background: white; }
    </style>
</head>
<body class="min-h-screen py-10 px-4">

    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-10 items-center">
        <div class="editor-card p-8 rounded-3xl space-y-6 order-2 lg:order-1">
            <h2 class="text-2xl font-black text-[#c5a059] text-center">معايدة أعضاء الصحيفة</h2>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-400 mb-1">ارفع الخلفية (القماشية البيضاء)</label>
                    <input type="file" id="bgIn" accept="image/*" class="w-full text-sm text-slate-400 file:bg-blue-600 file:text-white rounded-lg cursor-pointer" onchange="loadBg(event)">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">شعار الصحيفة</label>
                    <input type="file" id="logoIn" accept="image/*" class="w-full text-sm text-slate-400 file:bg-red-600 file:text-white rounded-lg cursor-pointer" onchange="loadLogo(event)">
                </div>
                <div>
                    <label class="block text-sm text-gray-400 mb-1">صورتك الشخصية</label>
                    <input type="file" id="userIn" accept="image/*" class="w-full text-sm text-slate-400 file:bg-[#c5a059] file:text-black rounded-lg cursor-pointer" onchange="loadUser(event)">
                </div>
                <input type="text" id="nameIn" placeholder="اسمك الكامل" class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-[#c5a059]" oninput="draw()">
                
                <select id="greetingIn" class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 outline-none focus:border-[#c5a059]" onchange="draw()">
                    <option value="نهنئكم بحلول عيد الفطر المبارك">نهنئكم بحلول عيد الفطر المبارك</option>
                    <option value="نبارك لكم العيد.. وكل عام وأنتم بخير">نبارك لكم العيد.. وكل عام وأنتم بخير</option>
                    <option value="أسرة صحيفة الحقيقة تهنئكم بالعيد">أسرة صحيفة الحقيقة تهنئكم بالعيد</option>
                </select>
            </div>

            <button onclick="download()" class="w-full bg-[#c5a059] text-black font-black py-5 rounded-2xl text-xl hover:bg-amber-600 shadow-xl">تحميل البطاقة النهائية</button>
        </div>

        <div class="flex justify-center order-1 lg:order-2">
            <canvas id="card" width="1000" height="1428"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('card');
        const ctx = canvas.getContext('2d');
        let bgImg = null, logoImg = null, userImg = null;

        function loadBg(e) {
            const r = new FileReader();
            r.onload = (ev) => { bgImg = new Image(); bgImg.onload = draw; bgImg.src = ev.target.result; };
            r.readAsDataURL(e.target.files[0]);
        }
        function loadLogo(e) {
            const r = new FileReader();
            r.onload = (ev) => { logoImg = new Image(); logoImg.onload = draw; logoImg.src = ev.target.result; };
            r.readAsDataURL(e.target.files[0]);
        }
        function loadUser(e) {
            const r = new FileReader();
            r.onload = (ev) => { userImg = new Image(); userImg.onload = draw; userImg.src = ev.target.result; };
            r.readAsDataURL(e.target.files[0]);
        }

        function draw() {
            const w = canvas.width, h = canvas.height;
            const name = document.getElementById('nameIn').value || "يوسف العاتي";
            const greeting = document.getElementById('greetingIn').value;

            // 1. الخلفية
            if (bgImg) ctx.drawImage(bgImg, 0, 0, w, h);
            else { ctx.fillStyle = "#ffffff"; ctx.fillRect(0, 0, w, h); }

            // 2. الشعار
            if (logoImg) {
                const lw = 280; const aspect = logoImg.width / logoImg.height;
                ctx.drawImage(logoImg, w - lw - 50, 50, lw, lw / aspect);
            }

            // 3. صورة العضو
            const cx = w/2, cy = 480, r = 200;
            ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.clip();
            if(userImg) ctx.drawImage(userImg, cx - r, cy - r, r*2, r*2);
            else { ctx.fillStyle = "#eee"; ctx.fill(); }
            ctx.restore();
            ctx.strokeStyle = "#c5a059"; ctx.lineWidth = 10; ctx.stroke();

            // 4. نصوص التهنئة
            ctx.textAlign = "center";
            ctx.fillStyle = "#1e3a5f";
            ctx.font = "900 100px 'Cairo'";
            ctx.fillText("عيدكم مبارك", w/2, 850);

            ctx.font = "700 40px 'Cairo'";
            ctx.fillText(greeting, w/2, 950);
            ctx.font = "400 30px 'Cairo'";
            ctx.fillText("وكل عام وأنتم بخير", w/2, 1020);

            // 5. شريط اسم العضو في الأسفل
            ctx.fillStyle = "#c5a059";
            const bw = 600, bh = 120;
            ctx.beginPath(); ctx.roundRect(w/2 - bw/2, 1150, bw, bh, 60); ctx.fill();

            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 50px 'Cairo'";
            ctx.fillText(name, w/2, 1230);
        }

        function download() {
            const l = document.createElement('a');
            l.download = 'Eid_Haqiqa_Card.png';
            l.href = canvas.toDataURL('image/png', 1.0);
            l.click();
        }

        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
                this.beginPath(); this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r);
                this.closePath(); return this;
            };
        }
        draw();
    </script>
</body>
</html>
