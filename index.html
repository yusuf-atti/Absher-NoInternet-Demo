<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة تهاني عيد الأضحى | صحيفة الحقيقة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            font-family: 'Cairo', sans-serif; 
            color: white; 
            background: linear-gradient(rgba(15, 23, 42, 0.92), rgba(15, 23, 42, 0.92)), 
                        url('https://alhqyq.com/contents/newsm/25001_0.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .editor-card { 
            background: rgba(30, 41, 59, 0.75); 
            backdrop-filter: blur(20px); 
            border: 2px solid #c5a059; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        canvas { 
            border-radius: 20px; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.6); 
            max-width: 100%; 
            height: auto;
            border: 1px solid rgba(197, 160, 89, 0.3);
        }
    </style>
</head>
<body class="py-10 px-4">

    <div class="max-w-6xl w-full grid grid-cols-1 lg:grid-cols-2 gap-10 items-center">
        
        <!-- لوحة التحكم -->
        <div class="editor-card p-8 rounded-3xl space-y-6 order-2 lg:order-1">
            <div class="text-center border-b border-gray-600 pb-4">
                <h1 class="text-2xl font-black text-[#c5a059]">بطاقات معايدة صحيفة الحقيقة</h1>
                <p class="text-gray-300 text-sm mt-1">أدخل الاسم لتجهيز التهنئة الرسمية</p>
            </div>

            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-gray-200 mb-2 font-bold text-right">اسم عضو الصحيفة</label>
                    <input type="text" id="nameIn" placeholder="اكتب اسمك هنا..." 
                        class="w-full p-4 rounded-xl bg-slate-900 border border-slate-700 outline-none focus:border-[#c5a059] text-white font-bold text-center" oninput="drawCard()">
                </div>
            </div>

            <button onclick="downloadCard()" class="w-full bg-gradient-to-r from-amber-600 to-amber-400 text-slate-900 font-black py-5 rounded-2xl text-xl hover:scale-[1.01] transition-all shadow-xl flex items-center justify-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
                <span>تحميل البطاقة الرسمية</span>
            </button>
        </div>

        <!-- معاينة البطاقة -->
        <div class="flex justify-center order-1 lg:order-2">
            <canvas id="cardCanvas" width="1000" height="1778"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('cardCanvas');
        const ctx = canvas.getContext('2d');
        
        const bgImg = new Image();
        // استخدام بروكسي لتفادي حظر الصورة وظهورها باللون الأبيض
        bgImg.crossOrigin = "anonymous"; 
        bgImg.src = 'https://images.weserv.nl/?url=alhqyq.com/contents/newsm/25001_0.jpg';

        bgImg.onload = () => {
            drawCard();
        };

        function drawCard() {
            const w = canvas.width;
            const h = canvas.height;
            const name = document.getElementById('nameIn').value.trim() || "اسم العضو";

            // مسح الكانفاس
            ctx.clearRect(0, 0, w, h);

            // 1. رسم الصورة الخلفية
            if (bgImg.complete) {
                ctx.drawImage(bgImg, 0, 0, w, h);
            }

            // 2. إعدادات النص (تصغير الخط)
            ctx.textAlign = "center";
            ctx.fillStyle = "#112233"; 
            ctx.font = "bold 45px 'Cairo'"; 

            // 3. تحديد الموقع: تم إنزاله بمقدار 40 بكسل (حوالي 1 سم) عن الموضع السابق
            const textX = w / 2;
            const textY = h - 380; 

            // 4. كتابة الاسم
            ctx.fillText(name, textX, textY);
        }

        function downloadCard() {
            const nameInput = document.getElementById('nameIn').value.trim();
            const fileName = nameInput ? `AlHaqiqa_${nameInput}.png` : "Eid_Card.png";
            
            drawCard();
            
            try {
                const dataURL = canvas.toDataURL('image/png', 1.0);
                const link = document.createElement('a');
                link.download = fileName;
                link.href = dataURL;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (e) {
                alert("يرجى الضغط مطولاً على الصورة لحفظها إذا لم يبدأ التحميل.");
            }
        }
    </script>
</body>
</html>
